
name: Build BotPlay4U iOS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build BotPlay4U for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given

      - name: Upload BotPlay4U
        uses: actions/upload-artifact@v4
        with:
          name: BotPlay4U-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
