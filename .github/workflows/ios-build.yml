name: Build BotPlay4U for iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    name: Build iOS Geode package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Geode 5.10.1 stable SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: BotPlay4U
          sdk: 5.10.1
          target: iOS
      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: BotPlay4U-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
